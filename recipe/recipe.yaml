# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.4"

package:
  name: authlib
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/a/authlib/authlib-${{ version }}.tar.gz
    sha256: f55a25f561f1f157ceca64da9df776f469f23715ac89ee338aa2f83dc9774e13
  - target_directory: src
    url: https://github.com/authlib/authlib/archive/refs/tags/v${{ version }}.tar.gz
    sha256: f1f6bec3ff30a0ed1d0e8d914c5ecd117b5ed9e19c51ff61b549b65965cd07df

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - cryptography >=45.0.1
    - joserfc >=1.6.8

tests:
  - python:
      imports: authlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - src/tests/
        - src/pyproject.toml
    requirements:
      run:
        - cachelib
        - django
        - flask-sqlalchemy
        - httpx <1
        - pytest-asyncio
        - pytest-django
        - pytest-env
        - python ${{ python_min }}.*
        - requests
        - starlette-full
    script:
      - cd src
      - pytest -vv --tb=long --color=yes

about:
  summary: The ultimate Python library in building OAuth and OpenID Connect servers and clients.
  license: BSD-3-Clause
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/authlib
  repository: https://github.com/authlib/authlib
  documentation: https://docs.authlib.org

extra:
  recipe-maintainers:
    - chrisburr
    - markfennema
    - xylar
