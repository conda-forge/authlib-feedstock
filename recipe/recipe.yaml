# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.9.3"

package:
  name: authlib
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/a/authlib/authlib-${{ version }}.tar.gz
    sha256: 2f834630f452d2e01d787b5477cf37341b73577073bfab38f10d988782da018b
  - target_directory: src
    url: https://github.com/authlib/authlib/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 65608222c6a5f00a66f7e7b1821d858d48f655afa160635bddb1397d8476d181

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - cryptography >=45.0.1
    - joserfc >=1.6.8

tests:
  - python:
      imports: authlib
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - src/tests/
        - src/pyproject.toml
    requirements:
      run:
        - cachelib
        - django
        - flask-sqlalchemy
        - httpx <1
        - pytest-asyncio
        - pytest-django
        - pytest-env
        - python ${{ python_min }}.*
        - requests
        - starlette-full
    script:
      - cd src
      - pytest -vv --tb=long --color=yes

about:
  summary: The ultimate Python library in building OAuth and OpenID Connect servers and clients.
  license: BSD-3-Clause
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/authlib
  repository: https://github.com/authlib/authlib
  documentation: https://docs.authlib.org

extra:
  recipe-maintainers:
    - chrisburr
    - markfennema
    - xylar
